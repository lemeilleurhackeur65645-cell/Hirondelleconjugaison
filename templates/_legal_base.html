<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}{% endblock %} | Hirondelle Conjugaison</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  <link rel="canonical" href="{{ site_url }}{{ request.path }}">
  {% block robots %}{% endblock %}
  <link rel="icon" type="image/png" href="/static/img/logo.png">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body{padding-top:56px;margin:0;font-family:'Inter',Arial,sans-serif;background:linear-gradient(135deg,#f0f4ff,#f5f0ff);background-attachment:fixed;color:#0f172a}
    .legal{max-width:780px;margin:0 auto;padding:32px 20px 24px;text-align:left}
    .legal article{background:rgba(255,255,255,.97);border-radius:18px;padding:28px 30px;box-shadow:0 4px 20px rgba(15,23,42,.07);line-height:1.65;font-size:.95rem}
    .legal h1{font-size:1.6rem;font-weight:800;margin:0 0 4px}
    .legal h2{font-size:1.05rem;font-weight:800;margin:26px 0 8px;color:#0f172a}
    .legal p,.legal li{color:#334155}
    .legal .maj{font-size:.8rem;color:#94a3b8;margin:0 0 18px}
    .legal a{color:#0056d6}
    .legal table{width:100%;border-collapse:collapse;font-size:.85rem;margin:10px 0}
    .legal th,.legal td{border:1px solid #e2e8f0;padding:8px 10px;vertical-align:top;text-align:left}
    .legal th{background:#f1f5f9;font-weight:700}
    .legal .box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px 16px;margin:14px 0}
  </style>
</head>
<body>
{% include '_topbar.html' %}
<main id="contenu" tabindex="-1" class="legal"><article>
{% block contenu %}{% endblock %}
</article></main>
{% include '_footer.html' %}
</body>
</html>
